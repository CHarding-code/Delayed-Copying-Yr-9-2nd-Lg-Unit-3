<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPI : Copie Différée - La mode et les vêtements</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #111827;
        color: #f3f4f6;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        background-color: #1f2937;
        width: 100%;
        max-width: 850px;
        border-radius: 16px;
        padding: 30px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        border: 1px solid #374151;
    }
    h1 { color: #60a5fa; margin-top: 0; font-size: 2rem; }
    .badge {
        display: inline-block;
        background-color: #3b82f6;
        color: #ffffff;
        padding: 6px 16px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.95rem;
        margin-bottom: 15px;
    }
    .instructions {
        background-color: #374151;
        padding: 12px 20px;
        border-radius: 8px;
        color: #d1d5db;
        font-size: 1rem;
        margin-bottom: 25px;
    }
    .display-area {
        background-color: #111827;
        border: 2px solid #4b5563;
        border-radius: 12px;
        padding: 30px;
        min-height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
    }
    .sentence-text {
        font-size: 1.5rem;
        font-weight: 600;
        color: #10b981;
        line-height: 1.4;
    }
    .blank-state {
        color: #9ca3af;
        font-style: italic;
        font-size: 1.4rem;
    }
    .timer {
        font-size: 3rem;
        font-weight: bold;
        color: #f59e0b;
        height: 60px;
        margin-bottom: 20px;
    }
